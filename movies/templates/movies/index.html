{% extends 'base.html' %}
{% block content %}
{% load static %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>List of Movies</h2>
        <hr />
          <form method="GET">
            <div class="row">
              <div class="col-auto">
                <input type="number" name="min_price" min="0"
                  class="form-control" placeholder="Min $"
                  value="{{request.GET.min_price}}">
              </div>
              <div class="col-auto">
                <input type="number" name="max_price" min="0"
                  class="form-control" placeholder="Max $"
                  value="{{request.GET.max_price}}">
              </div>
              <div class="col-auto">
                  <select name="sort" class="form-select">
                    <option value="low"> Low to High </option>
                    <option value="high" {% if request.GET.sort == "high" %} selected {% endif %}> 
                      High to Low </option>
                  </select>
              </div>
              <div class="col-auto">
                <div class="input-group">
                  <div class="input-group-text"> Search</div>
                    <input type="text" class="form-control"
                      name="search" value = "{{ request.GET.search}}">
                </div>
              </div>  
              <div class="col-auto">
                <button class="btn bg-dark text-white"
                  type="submit">Search</button>
              </div>
            </div>
          </form>
      </div>
    </div>
    <div class="row">
      {% for movie in template_data.movies %}
      <div class="col-md-4 col-lg-3 mb-2">
        <div class="p-2 card align-items-center pt-4">
          <img src="{{ movie.image.url }}"
            class="card-img-top rounded img-card-200">
          <div class="card-body text-center">
            <a href="{% url 'movies.show' id=movie.id %}"
              class="btn bg-dark text-white">
                {{ movie.name }}
            </a>
          </div>
        </div>
      </div>

      {% empty %}
        <p> No movies matched your search filters </p>
        
      {% endfor %}
    </div>
  </div>
</div>
{% endblock content %}
